[package]
name = "sdlint"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A deterministic structured-data linter"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
thiserror = "2"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

